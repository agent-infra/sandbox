<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jupyter tier resident memory</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 1000px; width: 100%; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="40 24 940 404" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
      <rect x="40" y="24" width="940" height="404" fill="#f5f5f5"/>

      <!-- Value gridlines: 0..125 MB across x=300..920 (4.96 px per MB) -->
      <line x1="424" y1="40" x2="424" y2="340" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="548" y1="40" x2="548" y2="340" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="672" y1="40" x2="672" y2="340" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="796" y1="40" x2="796" y2="340" stroke="rgba(45,49,66,0.08)" stroke-width="0.8"/>
      <line x1="920" y1="40" x2="920" y2="340" stroke="rgba(45,49,66,0.06)" stroke-width="0.8"/>
      <!-- Axes -->
      <line x1="300" y1="40" x2="300" y2="340" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <line x1="300" y1="340" x2="920" y2="340" stroke="rgba(45,49,66,0.25)" stroke-width="1"/>
      <text x="300" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">0</text>
      <text x="424" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">25</text>
      <text x="548" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">50</text>
      <text x="672" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">75</text>
      <text x="796" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">100</text>
      <text x="920" y="356" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">125</text>
      <text x="610" y="374" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.14em">RESIDENT MEMORY PER PROCESS AT IDLE · MB</text>

      <!-- Group: aiod -->
      <text x="80" y="60" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em">AIOD + EMBEDDED KERNEL</text>
      <text x="920" y="60" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end" letter-spacing="0.08em">IDLE TOTAL 69.8 MB · 8 PROCESSES</text>

      <text x="292" y="86" fill="#2d3142" font-size="13" font-weight="600" text-anchor="end">aiod</text>
      <rect x="300" y="72" width="72" height="20" fill="#f5f5f5"/>
      <rect x="300" y="72" width="72" height="20" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="380" y="86" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">14.6</text>

      <text x="292" y="118" fill="#2d3142" font-size="13" font-weight="600" text-anchor="end">ipykernel</text>
      <rect x="300" y="104" width="301" height="20" fill="#f5f5f5"/>
      <rect x="300" y="104" width="301" height="20" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="609" y="118" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, monospace">60.7</text>

      <text x="292" y="150" fill="#2d3142" font-size="13" font-weight="600" text-anchor="end">node harness (warm)</text>
      <rect x="300" y="136" width="224" height="20" fill="#f5f5f5"/>
      <rect x="300" y="136" width="224" height="20" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="532" y="150" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">45.2</text>

      <!-- Group: 1.x python server -->
      <text x="80" y="196" fill="#2d3142" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em">1.X PYTHON SERVER + JUPYTER</text>
      <text x="920" y="196" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end" letter-spacing="0.08em">IDLE TOTAL 248.4 MB · 9 PROCESSES</text>

      <text x="292" y="222" fill="#2d3142" font-size="13" font-weight="600" text-anchor="end">python web app</text>
      <rect x="300" y="208" width="595" height="20" fill="#f5f5f5"/>
      <rect x="300" y="208" width="595" height="20" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="903" y="222" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">120.0</text>

      <text x="292" y="254" fill="#2d3142" font-size="13" font-weight="600" text-anchor="end">jupyter server</text>
      <rect x="300" y="240" width="507" height="20" fill="#f5f5f5"/>
      <rect x="300" y="240" width="507" height="20" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="815" y="254" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">102.3</text>

      <text x="292" y="286" fill="#2d3142" font-size="13" font-weight="600" text-anchor="end">ipykernel</text>
      <rect x="300" y="272" width="297" height="20" fill="#f5f5f5"/>
      <rect x="300" y="272" width="297" height="20" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="605" y="286" fill="#eb6c36" font-size="10" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, monospace">59.8</text>

      <text x="292" y="318" fill="#2d3142" font-size="13" font-weight="600" text-anchor="end">supervisord</text>
      <rect x="300" y="304" width="114" height="20" fill="#f5f5f5"/>
      <rect x="300" y="304" width="114" height="20" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="422" y="318" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">23.0</text>

      <!-- Legend strip -->
      <line x1="40" y1="396" x2="960" y2="396" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="408" width="14" height="10" rx="2" fill="rgba(235,108,54,0.12)" stroke="#eb6c36" stroke-width="1"/>
      <text x="60" y="416" fill="#4f5d75" font-size="10">The kernel: the same ~60 MB on both sides</text>
      <rect x="320" y="408" width="14" height="10" rx="2" fill="rgba(79,93,117,0.15)" stroke="#4f5d75" stroke-width="1"/>
      <text x="340" y="416" fill="#4f5d75" font-size="10">What else stays resident</text>
      <text x="960" y="416" fill="#7a8399" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="end">0.5 CPU · 0.5 GiB · one warm kernel each · 2026-08</text>
    </svg>
  </div>
</body>
</html>
