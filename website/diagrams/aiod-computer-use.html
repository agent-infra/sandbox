<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>computer-use worker</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f5f5f5; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
    .frame { max-width: 952px; width: 100%; }
    svg { width: 100%; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <svg viewBox="0 0 952 260" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <g transform="translate(-24 -136)">
      <!-- Arrows (behind boxes) -->
      <line x1="168" y1="208" x2="232" y2="208" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <line x1="384" y1="208" x2="464" y2="208" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <line x1="688" y1="208" x2="776" y2="208" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <!-- Direct path: agent to worker, routed under aiod -->
      <path d="M 168,232 H 200 Q 208,232 208,240 V 296 Q 208,304 216,304 H 568 Q 576,304 576,296 V 256" fill="none" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>

      <!-- Arrow labels -->
      <rect x="180" y="188" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="200" y="198" fill="#2e5aa8" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">HTTP</text>

      <rect x="388" y="188" width="72" height="14" rx="2" fill="#f5f5f5"/>
      <text x="424" y="198" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">/v2/computer</text>

      <rect x="712" y="188" width="40" height="14" rx="2" fill="#f5f5f5"/>
      <text x="732" y="198" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">INPUT</text>

      <rect x="328" y="284" width="120" height="14" rx="2" fill="#f5f5f5"/>
      <text x="388" y="294" fill="#2e5aa8" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DIRECT · SAME KEY</text>

      <!-- Node: Agent -->
      <rect x="40" y="176" width="128" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="40" y="176" width="128" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <rect x="48" y="183" width="40" height="13" rx="2" fill="transparent" stroke="rgba(122,131,153,0.40)" stroke-width="0.8"/>
      <text x="68" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">CLIENT</text>
      <text x="104" y="215" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Agent</text>
      <text x="104" y="231" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">HTTP client</text>

      <!-- Node: aiod -->
      <rect x="232" y="176" width="152" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="232" y="176" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <rect x="240" y="183" width="52" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.40)" stroke-width="0.8"/>
      <text x="266" y="193" fill="#2d3142" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">DAEMON</text>
      <text x="308" y="215" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">aiod</text>
      <text x="308" y="231" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">:18091 · proxy</text>

      <!-- Node: computer-use (focal) -->
      <rect x="464" y="160" width="224" height="96" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="160" width="224" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <rect x="472" y="167" width="52" height="13" rx="2" fill="transparent" stroke="rgba(235,108,54,0.50)" stroke-width="0.8"/>
      <text x="498" y="177" fill="#eb6c36" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">WORKER</text>
      <text x="576" y="205" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">computer-use</text>
      <text x="576" y="224" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">screenshot · actions · a11y</text>
      <text x="576" y="241" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">:18100 · /healthz · /capabilities</text>

      <!-- Node: Desktop -->
      <rect x="776" y="176" width="184" height="64" rx="6" fill="#f5f5f5"/>
      <rect x="776" y="176" width="184" height="64" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <rect x="784" y="183" width="30" height="13" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
      <text x="799" y="193" fill="#7a8399" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">EXT</text>
      <text x="868" y="215" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Desktop session</text>
      <text x="868" y="231" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">X11 · Windows logon</text>

      <!-- Legend strip -->
      <line x1="40" y1="352" x2="976" y2="352" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <rect x="40" y="362" width="16" height="11" rx="2" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="64" y="371" fill="#4f5d75" font-size="10">The only process that touches the desktop</text>
      <line x1="344" y1="368" x2="372" y2="368" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <text x="380" y="371" fill="#4f5d75" font-size="10">Through aiod: 503 when the worker is down</text>
      <line x1="664" y1="368" x2="692" y2="368" stroke="#2e5aa8" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow-link)"/>
      <text x="700" y="371" fill="#4f5d75" font-size="10">Direct: same routes, same key</text>
      </g>
    </svg>
  </div>
</body>
</html>
