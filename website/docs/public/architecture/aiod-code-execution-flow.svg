<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 452" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="88" y1="64" x2="88" y2="436" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="344" y1="64" x2="344" y2="436" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="536" y1="64" x2="536" y2="436" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="712" y1="64" x2="712" y2="436" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- Activation: one session across both execute calls -->
      <rect x="532" y="180" width="8" height="128" rx="1" fill="rgba(45,49,66,0.08)" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>

      <!-- 1. write the dataset -->
      <line x1="92" y1="96" x2="340" y2="96" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <rect x="171" y="75" width="90" height="14" rx="2" fill="#f5f5f5"/>
      <text x="216" y="86" fill="#2e5aa8" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">/v2/fs/write</text>

      <line x1="348" y1="124" x2="708" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="492" y="103" width="72" height="14" rx="2" fill="#f5f5f5"/>
      <text x="528" y="114" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">sales.csv</text>

      <!-- 2. load and compute in the named session -->
      <line x1="92" y1="160" x2="340" y2="160" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <rect x="158" y="139" width="116" height="14" rx="2" fill="#f5f5f5"/>
      <text x="216" y="150" fill="#2e5aa8" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">/v2/code/execute</text>

      <line x1="348" y1="188" x2="532" y2="188" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="386" y="167" width="108" height="14" rx="2" fill="#f5f5f5"/>
      <text x="440" y="178" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">df = read_csv()</text>

      <line x1="532" y1="216" x2="84" y2="216" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="254" y="195" width="108" height="14" rx="2" fill="#f5f5f5"/>
      <text x="308" y="206" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">outputs[0].text</text>

      <!-- 3. plot in the same session, save the chart -->
      <line x1="92" y1="244" x2="340" y2="244" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <rect x="158" y="223" width="116" height="14" rx="2" fill="#f5f5f5"/>
      <text x="216" y="234" fill="#2e5aa8" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">/v2/code/execute</text>

      <line x1="348" y1="272" x2="532" y2="272" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="386" y="251" width="108" height="14" rx="2" fill="#f5f5f5"/>
      <text x="440" y="262" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Agg · savefig()</text>

      <line x1="540" y1="300" x2="708" y2="300" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
      <rect x="592" y="279" width="64" height="14" rx="2" fill="#f5f5f5"/>
      <text x="624" y="290" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">plot.png</text>

      <!-- 4. the chart comes back over the file plane -->
      <line x1="92" y1="336" x2="340" y2="336" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <rect x="174" y="315" width="84" height="14" rx="2" fill="#f5f5f5"/>
      <text x="216" y="326" fill="#2e5aa8" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">/v2/fs/list</text>

      <line x1="708" y1="364" x2="84" y2="364" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
      <rect x="367" y="343" width="58" height="14" rx="2" fill="#f5f5f5"/>
      <text x="396" y="354" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">files[]</text>

      <line x1="92" y1="392" x2="340" y2="392" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <rect x="162" y="371" width="108" height="14" rx="2" fill="#f5f5f5"/>
      <text x="216" y="382" fill="#2e5aa8" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">/v2/fs/download</text>

      <line x1="708" y1="420" x2="84" y2="420" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="326" y="399" width="140" height="14" rx="2" fill="#f5f5f5"/>
      <text x="396" y="410" fill="#eb6c36" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">attachment: plot.png</text>

      <!-- Lifeline heads -->
      <rect x="16" y="24" width="144" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="16" y="24" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="88" y="49" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Agent</text>

      <rect x="272" y="24" width="144" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="272" y="24" width="144" height="40" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
      <text x="344" y="45" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">aiod</text>
      <text x="344" y="58" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">:18091</text>

      <rect x="464" y="24" width="144" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="464" y="24" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="536" y="45" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Session</text>
      <text x="536" y="58" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">analysis</text>

      <rect x="640" y="24" width="144" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="640" y="24" width="144" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="712" y="45" fill="#2d3142" font-size="14" font-weight="600" text-anchor="middle">Files</text>
      <text x="712" y="58" fill="#4f5d75" font-size="10.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">/tmp/analysis</text>

    </svg>
