<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 800 432" xmlns="http://www.w3.org/2000/svg" font-family="'Geist', 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif">
      <defs>
        <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap');</style>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
      </defs>

      <rect width="100%" height="100%" fill="#f5f5f5"/>

      <!-- Lifelines -->
      <line x1="72" y1="64" x2="72" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="232" y1="64" x2="232" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="416" y1="64" x2="416" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="576" y1="64" x2="576" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
      <line x1="728" y1="64" x2="728" y2="384" stroke="rgba(45,49,66,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

      <!-- alt frame: which backend runs python -->
      <rect x="208" y="140" width="576" height="204" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <rect x="208" y="140" width="72" height="16" fill="rgba(45,49,66,0.06)" stroke="rgba(45,49,66,0.25)" stroke-width="0.8"/>
      <text x="244" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.10em">ALT PYTHON</text>
      <line x1="208" y1="208" x2="784" y2="208" stroke="rgba(45,49,66,0.25)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <line x1="208" y1="276" x2="784" y2="276" stroke="rgba(45,49,66,0.25)" stroke-width="0.8" stroke-dasharray="4,3"/>
      <text x="288" y="152" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-style="italic">[AIO_JUPYTER_ENDPOINT reachable]</text>
      <text x="216" y="222" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-style="italic">[ipykernel importable]</text>
      <text x="216" y="290" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-style="italic">[otherwise · and every javascript request]</text>

      <!-- Activation bars -->
      <rect x="228" y="104" width="8" height="268" fill="rgba(235,108,54,0.10)" stroke="#eb6c36" stroke-width="0.8"/>
      <rect x="412" y="178" width="8" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="572" y="246" width="8" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
      <rect x="724" y="314" width="8" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

      <!-- Messages -->
      <line x1="76" y1="104" x2="228" y2="104" stroke="#2e5aa8" stroke-width="1.4" marker-end="url(#arrow-link)"/>
      <rect x="86" y="86" width="132" height="14" rx="2" fill="#f5f5f5"/>
      <text x="152" y="96" fill="#2e5aa8" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">POST /v2/code/execute</text>

      <line x1="236" y1="178" x2="412" y2="178" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="276" y="160" width="96" height="14" rx="2" fill="#f5f5f5"/>
      <text x="324" y="170" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">execute · proxied</text>
      <line x1="412" y1="196" x2="236" y2="196" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <line x1="236" y1="246" x2="572" y2="246" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="248" y="228" width="132" height="14" rx="2" fill="#f5f5f5"/>
      <text x="314" y="238" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">execute_request · ZMQ</text>
      <line x1="572" y1="264" x2="236" y2="264" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <line x1="236" y1="314" x2="724" y2="314" stroke="#4f5d75" stroke-width="1.4" marker-end="url(#arrow)"/>
      <rect x="248" y="296" width="124" height="14" rx="2" fill="#f5f5f5"/>
      <text x="310" y="306" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">{code, timeout_ms}</text>
      <line x1="724" y1="332" x2="236" y2="332" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arrow)"/>

      <line x1="228" y1="372" x2="76" y2="372" stroke="#eb6c36" stroke-width="1.4" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>
      <rect x="80" y="354" width="144" height="14" rx="2" fill="#f5f5f5"/>
      <text x="152" y="364" fill="#eb6c36" font-size="9.5" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">{status, outputs, stdout}</text>

      <!-- Actors -->
      <rect x="16" y="24" width="112" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="16" y="24" width="112" height="40" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
      <text x="72" y="49" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Agent</text>

      <rect x="176" y="24" width="112" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="176" y="24" width="112" height="40" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
      <text x="232" y="49" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">aiod</text>

      <rect x="360" y="24" width="112" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="360" y="24" width="112" height="40" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
      <text x="416" y="41" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Jupyter endpoint</text>
      <text x="416" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">external</text>

      <rect x="520" y="24" width="112" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="520" y="24" width="112" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="576" y="41" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">ipykernel</text>
      <text x="576" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">spawned by aiod</text>

      <rect x="672" y="24" width="112" height="40" rx="6" fill="#f5f5f5"/>
      <rect x="672" y="24" width="112" height="40" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
      <text x="728" y="41" fill="#2d3142" font-size="13" font-weight="600" text-anchor="middle">Native REPL</text>
      <text x="728" y="56" fill="#4f5d75" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">python3 · node</text>

      <!-- Footnote -->
      <line x1="16" y1="400" x2="784" y2="400" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
      <text x="16" y="418" fill="#4f5d75" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace">AIO_CODE_BACKEND = auto (this order) · native · kernel</text>
    </svg>
